# =============================================================================
# Docker Compose Override für zusätzliche Services
# =============================================================================
# Diese Datei erweitert die Standard Supabase docker-compose.yml um:
# - Caddy (Reverse Proxy & SSL Termination)
# - Portainer (Container Management)
# - docker-volume-backup (Automatische Backups)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Storage Override - S3/R2 Backend statt lokales Dateisystem
  # ---------------------------------------------------------------------------
  # Die Standard docker-compose.yml setzt STORAGE_BACKEND=file hardcoded.
  # Dieser Override aktiviert S3 (Cloudflare R2) als Storage-Backend.
  # ---------------------------------------------------------------------------
  storage:
    environment:
      STORAGE_BACKEND: s3
      GLOBAL_S3_BUCKET: "${S3_STORAGE_BUCKET}"
      GLOBAL_S3_ENDPOINT: "${S3_ENDPOINT}"
      GLOBAL_S3_PROTOCOL: https
      GLOBAL_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_KEY}"
      AWS_DEFAULT_REGION: "${S3_REGION}"
      REGION: "${S3_REGION}"
      # R2 unterstuetzt kein S3 Object Tagging (x-amz-tagging → 501 NotImplemented)
      TUS_ALLOW_S3_TAGS: "false"
    volumes: []
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # Functions Override - App-spezifische Secrets via env_file
  # ---------------------------------------------------------------------------
  # Memory-Limit: V8 gibt den Speicher beendeter Isolates nicht ans Betriebssystem
  # zurueck — der Prozess haelt dauerhaft seinen hoechsten je erreichten RSS.
  # Ohne Limit ist dieser Peak lastabhaengig: nach einem Integration-Testlauf
  # stand er bei 1,13 GB von 3,7 GB Gesamtspeicher, wodurch die Maschine ins
  # Page-Cache-Thrashing lief (kein Swap) und selbst sshd verhungerte.
  #
  # Mit Limit uebernimmt Docker: der Container wird per OOM beendet und durch
  # `restart: unless-stopped` (aus der Basis-Compose) in Sekunden neu gestartet.
  # Aus "die Maschine steht" wird "die Functions sind kurz weg" — ein Fehlerbild,
  # das sich von selbst erholt.
  #
  # Der eigentliche Deckel sitzt in main/index.ts des App-Repos
  # (MAX_CONCURRENT_WORKERS x MEMORY_LIMIT_MB). Dieses Limit ist das Sicherheitsnetz
  # darunter, falls dort etwas durchrutscht.
  functions:
    environment:
      SUPABASE_PUBLIC_URL: "${SUPABASE_PUBLIC_URL}"
    env_file:
      - path: .env.functions
        required: false
    deploy:
      resources:
        limits:
          memory: 768M

  # ---------------------------------------------------------------------------
  # Database Override - Backup Labels hinzufügen
  # ---------------------------------------------------------------------------
  db:
    deploy:
      resources:
        limits:
          memory: 640M
    labels:
      - "docker-volume-backup.archive-pre=/bin/sh -c 'pg_dump -U postgres -d postgres --clean --if-exists --quote-all-identifiers --no-owner --no-privileges --schema-only -f /var/lib/postgresql/data/backup_schema.sql && pg_dump -U postgres -d postgres --data-only --quote-all-identifiers --no-owner --no-privileges -f /var/lib/postgresql/data/backup_data.sql && pg_dumpall -U postgres --roles-only --no-role-passwords -f /var/lib/postgresql/data/backup_roles.sql'"
      - "docker-volume-backup.archive-post=/bin/sh -c 'rm -f /var/lib/postgresql/data/backup_schema.sql /var/lib/postgresql/data/backup_data.sql /var/lib/postgresql/data/backup_roles.sql'"

  # ---------------------------------------------------------------------------
  # Caddy - Reverse Proxy & SSL Termination
  # ---------------------------------------------------------------------------
  # KRITISCHER SERVICE - Muss immer laufen!
  # Caddy ist der zentrale Entry Point für alle Domains
  # ---------------------------------------------------------------------------
  caddy:
    container_name: caddy
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${ACME_DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL}"
    volumes:
      - /opt/supabase/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    # Ist-Verbrauch 32 MB — die frueheren 512M waren um Faktor 16 zu hoch und
    # haben Budget blockiert, das andere Container brauchen.
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
          cpus: '0.25'
    labels:
      - "docker-volume-backup.stop-during-backup=false"
    networks:
      - default
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 30s

  # ---------------------------------------------------------------------------
  # Portainer - Container Management UI
  # ---------------------------------------------------------------------------
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    command: --admin-password-file /tmp/portainer_password
    deploy:
      resources:
        limits:
          memory: 64M
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
      - /opt/supabase/portainer_password:/tmp/portainer_password:ro
    labels:
      - "docker-volume-backup.stop-during-backup=false"
    networks:
      - default

  # ---------------------------------------------------------------------------
  # docker-volume-backup - Automatische Backups zu S3
  # ---------------------------------------------------------------------------
  backup:
    container_name: backup
    image: offen/docker-volume-backup:v2
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: "${BACKUP_CRON_EXPRESSION:-0 3 * * *}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
      BACKUP_COMPRESSION: "gz"
      BACKUP_FILENAME: "backup-%Y-%m-%dT%H-%M-%S.{{ .Extension }}"
      AWS_S3_BUCKET_NAME: "${S3_BACKUP_BUCKET}"
      AWS_S3_PATH: "supabase"
      AWS_ENDPOINT: "${S3_ENDPOINT_HOST}"
      AWS_ENDPOINT_PROTO: "https"
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_KEY}"
      NOTIFICATION_URLS: "${NOTIFICATION_URLS:-}"
      NOTIFICATION_LEVEL: "error"
      GPG_PASSPHRASE: "${BACKUP_ENCRYPTION_KEY:-}"
    deploy:
      resources:
        limits:
          memory: 96M
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./volumes/db/data:/backup/db-data:ro
      - /opt/supabase/.env:/backup/config/.env:ro
    networks:
      - default

  # ---------------------------------------------------------------------------
  # Memory-Budget fuer die uebrigen Supabase-Services
  # ---------------------------------------------------------------------------
  # Die Maschine hat 3819 MB. Ohne Limits kann ein einzelner Container die
  # gesamte Kiste ins Page-Cache-Thrashing ziehen — genau das ist passiert, als
  # der Edge-Runtime auf 1,13 GB gewachsen war: Load 38 bei 90 MB freiem RAM,
  # und selbst sshd wurde unbedienbar.
  #
  # Jedes Limit ist am gemessenen Ist-Verbrauch bemessen (docker stats) plus
  # Reserve. Die Summe der Limits liegt bewusst ueber dem physischen RAM:
  # Limits sind Obergrenzen gegen Ausreisser, keine Reservierungen. Der reale
  # Spitzenbedarf liegt bei ~3,2 GB, es bleiben also ~600 MB fuer Kernel,
  # Page-Cache und SSH.
  #
  # Ist-Werte zum Zeitpunkt der Festlegung (2026-08-16):
  #   analytics 568 | db 482 | kong 399 | studio 207 | realtime 182
  #   pooler 169 | storage 137 | meta 107 | vector 41 | rest 37
  #   imgproxy 23 | auth 11
  # ---------------------------------------------------------------------------
  analytics:
    deploy:
      resources:
        limits:
          memory: 704M

  kong:
    deploy:
      resources:
        limits:
          memory: 448M

  studio:
    deploy:
      resources:
        limits:
          memory: 256M

  realtime:
    deploy:
      resources:
        limits:
          memory: 256M

  supavisor:
    deploy:
      resources:
        limits:
          memory: 224M

  meta:
    deploy:
      resources:
        limits:
          memory: 160M

  vector:
    deploy:
      resources:
        limits:
          memory: 96M

  rest:
    deploy:
      resources:
        limits:
          memory: 96M

  imgproxy:
    deploy:
      resources:
        limits:
          memory: 64M

  auth:
    deploy:
      resources:
        limits:
          memory: 96M

# =============================================================================
# Zusätzliche Volumes
# =============================================================================
volumes:
  portainer_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  caddy_logs:
    driver: local
